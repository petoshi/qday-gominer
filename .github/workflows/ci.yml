name: test

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Install OpenCL development files
        run: sudo apt-get update && sudo apt-get install -y ocl-icd-opencl-dev
      - run: go mod verify
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -trimpath ./...

  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Install Windows cross compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - run: go mod verify
      - name: Build Windows executable
        run: |
          set -eu
          mkdir -p build/windows
          x86_64-w64-mingw32-dlltool \
            -D OpenCL.dll \
            -d scripts/OpenCL.def \
            -l build/windows/libOpenCL.a
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 \
            CC=x86_64-w64-mingw32-gcc \
            CGO_LDFLAGS="-L${PWD}/build/windows" \
            go build -trimpath -o build/qday-gominer.exe .
          x86_64-w64-mingw32-objdump -p build/qday-gominer.exe | grep 'DLL Name: OpenCL.dll'
