name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Install OpenCL development files
        run: sudo apt-get update && sudo apt-get install -y ocl-icd-opencl-dev
      - run: go mod verify
      - run: go test ./...
      - name: Build archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          set -eu
          version="${RELEASE_TAG#v}"
          package="qday-gominer-${version}-linux-${RELEASE_ARCH}"
          mkdir -p "$package"
          go build -trimpath -ldflags="-s -w -X main.Version=${version}" -o "$package/qday-gominer" .
          cp README.md LICENSE "$package/"
          tar -czf "${package}.tar.gz" "$package"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qday-gominer-linux-${{ matrix.arch }}
          path: qday-gominer-*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v8
        with:
          pattern: qday-gominer-linux-*
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          cd artifacts
          sha256sum qday-gominer-*.tar.gz > SHA256SUMS
          gh release create "$RELEASE_TAG" qday-gominer-*.tar.gz SHA256SUMS \
            --verify-tag --notes-from-tag --title "QDAY gominer ${RELEASE_TAG}"
